spring.application.name=aaa

# 本地敏感项：复制 application-local.properties.example 为 application-local.properties 后修改
spring.config.import=optional:classpath:application-local.properties

# --- MySQL（可被 application-local.properties 覆盖）---
spring.datasource.url=jdbc:mysql://localhost:3306/aaa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Flyway：表结构只通过迁移脚本变更 ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# --- jwt设置---
velrix.jwt.secret=velrix-dev-jwt-secret-change-me-0123456789
velrix.jwt.access-token-minutes=30