# 集成测试：本机 MySQL + Redis（与 main 默认一致；不依赖 application-local 的 test profile）
spring.config.import=

spring.datasource.url=jdbc:mysql://localhost:3306/aaa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

velrix.jwt.secret=velrix-test-jwt-secret-change-me-0123456789
velrix.jwt.access-token-minutes=30
velrix.jwt.refresh-token-days=7

velrix.auth.max-login-failures=5
velrix.auth.login-lock-minutes=15
