# 若 application-local 激活了 test profile，仍提供完整数据源（Flyway 使用 classpath:db/migration 种子 V7/V8 等）
spring.datasource.url=jdbc:mysql://localhost:3306/aaa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

velrix.jwt.secret=velrix-test-jwt-secret-change-me-0123456789
velrix.jwt.access-token-minutes=30
velrix.jwt.refresh-token-days=7

velrix.auth.max-login-failures=5
velrix.auth.login-lock-minutes=15
